name: Update directory

on:
  workflow_dispatch:
  schedule:
    # Runs monthly on the 1st at 08:00 UTC.
    - cron: '0 8 1 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build latest directory from Google Sheet
        env:
          DIRECTORY_SOURCE_URL: ${{ vars.DIRECTORY_SOURCE_URL }}
          DIRECTORY_OUTPUT_HTML: index.html
        run: python build_site.py

      - name: Commit updated directory
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update community directory
          file_pattern: index.html
