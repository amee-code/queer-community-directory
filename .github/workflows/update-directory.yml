name: Update directory

on:
  workflow_dispatch:
  schedule:
    # Runs monthly on the 1st at 08:00 UTC.
    - cron: '0 8 1 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build latest directory from Google Sheet
        env:
          DIRECTORY_SOURCE_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vRQDMPDHu9vhPVw_XWFGH4xoOHcV5ugsGh1V3JaQc70_zkSO9PU1qtg7qPbFjnpuaOZOUh_GPkpR6nb/pub?output=csv
          DIRECTORY_OUTPUT_HTML: index.html
        run: python build_site.py

      - name: Commit updated directory
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update community directory
          file_pattern: index.html
